name: Deploy KadBraille Web PWA to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - "KadBraille-Web/**"
      - ".github/workflows/deploy-web-pwa.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy-pwa:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload KadBraille-Web artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: KadBraille-Web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
